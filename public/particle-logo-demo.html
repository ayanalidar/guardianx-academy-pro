<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardianX Particle Logo - Standalone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e2e8f0;
    overflow: hidden;
  }
  .logo-container {
    position: relative;
    width: 520px;
    height: 520px;
    max-width: 90vw;
    max-height: 90vh;
  }
  .glow {
    position: absolute;
    inset: 8%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, rgba(124,58,237,0.28), rgba(56,189,248,0.12) 40%, transparent 68%);
    filter: blur(32px);
    pointer-events: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
    z-index: 1;
  }
  .hint {
    position: fixed;
    bottom: 20px;
    font-size: 12px;
    font-family: monospace;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="logo-container" id="logoContainer">
    <div class="glow"></div>
    <canvas id="particleCanvas"></canvas>
  </div>
  <div class="hint">Move your cursor over the logo to shatter particles</div>

  <!-- Replace this URL with your actual logo image -->
  <!-- The image must be CORS-enabled (same origin or crossOrigin="anonymous" + CORS headers) -->
  <img id="logoSource" src="https://academy.guardianx.cloud/guardianx-logo-v2.png" crossorigin="anonymous" style="display:none">

<script>
/**
 * ParticleLogo - Standalone HTML Version
 * 
 * The logo is reconstructed from square particles sampled from an image.
 * 
 * Phases:
 * 1. ASSEMBLY - particles scattered outside → spring to target positions
 * 2. IDLE - subtle perlin-ish noise floating + opacity flicker
 * 3. MOUSE - cursor repels nearby particles; they spring back
 * 
 * Usage:
 *   - Replace the <img> src with your logo URL
 *   - Adjust `particleCount` for performance
 *   - Adjust `size` for the canvas dimensions
 */

const CONFIG = {
  size: 520,           // canvas size in CSS pixels
  particleCount: 2000, // target particle count (650 mobile, 1100 tablet, 2000 desktop)
  sampleRes: 300,      // sampling resolution for pixel extraction
  logoScale: 0.78,     // logo occupies 78% of canvas (centered)
  interactive: true,   // enable mouse shatter
  showGlow: true,      // show soft glow behind particles
  assemblyDuration: 2200, // ms for assembly animation
  repelRadius: 110,    // mouse repel radius
  repelStrength: 0.6,  // base repel force
};

// --- Particle type ---
const Particle = {
  tx: 0, ty: 0,        // target position
  x: 0, y: 0,          // current position
  vx: 0, vy: 0,        // velocity
  size: 0,             // particle size
  color: "",           // fill color
  baseOpacity: 0,      // base opacity
  opacity: 0,           // current opacity
  delay: 0,             // staggered start (0..1)
  seed: 0,              // per-particle noise seed
};

// --- State ---
let canvas, ctx, wrap;
let particles = [];
let phase = "loading"; // "loading" | "assembling" | "idle"
let mouse = { x: 0, y: 0, active: false };
let startTime = 0;
let dpr = 1;
let rafId = 0;
let prefersReducedMotion = false;

// --- Initialize ---
function init() {
  canvas = document.getElementById("particleCanvas");
  wrap = document.getElementById("logoContainer");
  
  if (!canvas || !wrap) return;

  prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const renderSize = CONFIG.size;

  canvas.width = renderSize * dpr;
  canvas.height = renderSize * dpr;
  canvas.style.width = renderSize + "px";
  canvas.style.height = renderSize + "px";

  // Load the logo image
  const img = document.getElementById("logoSource");
  if (!img.complete) {
    img.onload = () => buildParticles(img);
    img.onerror = () => console.error("Failed to load logo image");
  } else {
    buildParticles(img);
  }

  // Mouse tracking
  if (CONFIG.interactive) {
    window.addEventListener("mousemove", onMouseMove);
    window.addEventListener("mouseleave", () => { mouse.active = false; });
  }

  // Pause when tab hidden
  document.addEventListener("visibilitychange", onVisibilityChange);

  // Resize handler
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!document.hidden) buildParticles(document.getElementById("logoSource"));
    }, 300);
  });
}

// --- Build particles from the logo image ---
function buildParticles(img) {
  if (!img || !canvas) return;

  const renderSize = CONFIG.size;
  const sampleRes = CONFIG.sampleRes;

  // Draw to offscreen canvas for pixel sampling
  const off = document.createElement("canvas");
  off.width = sampleRes;
  off.height = sampleRes;
  const offCtx = off.getContext("2d", { willReadFrequently: true });
  offCtx.drawImage(img, 0, 0, sampleRes, sampleRes);
  const data = offCtx.getImageData(0, 0, sampleRes, sampleRes).data;

  // Collect non-transparent pixel positions + colors
  const candidates = [];
  for (let y = 0; y < sampleRes; y += 2) {
    for (let x = 0; x < sampleRes; x += 2) {
      const i = (y * sampleRes + x) * 4;
      const a = data[i + 3];
      if (a > 60) {
        candidates.push({
          x: (x / sampleRes) * renderSize * dpr,
          y: (y / sampleRes) * renderSize * dpr,
          r: data[i],
          g: data[i + 1],
          b: data[i + 2],
        });
      }
    }
  }

  // Subsample to target count
  let chosen = candidates;
  if (candidates.length > CONFIG.particleCount) {
    // Shuffle and take first N
    for (let i = candidates.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    chosen = candidates.slice(0, CONFIG.particleCount);
  }

  // Scale around center
  const cx = (renderSize * dpr) / 2;
  const cy = (renderSize * dpr) / 2;
  const logoScale = CONFIG.logoScale;

  particles = chosen.map((c) => {
    const scaledTx = cx + (c.x - cx) * logoScale;
    const scaledTy = cy + (c.y - cy) * logoScale;

    // Starting position: scattered in a ring around the logo
    const angle = Math.random() * Math.PI * 2;
    const dist = renderSize * dpr * (0.55 + Math.random() * 0.35);
    const startX = cx + Math.cos(angle) * dist;
    const startY = cy + Math.sin(angle) * dist;

    const psz = (1.6 + Math.random() * 2.2) * dpr;
    const baseOpacity = 0.7 + Math.random() * 0.3;

    return {
      tx: scaledTx,
      ty: scaledTy,
      x: prefersReducedMotion ? scaledTx : startX,
      y: prefersReducedMotion ? scaledTy : startY,
      vx: 0,
      vy: 0,
      size: psz,
      color: `rgb(${c.r},${c.g},${c.b})`,
      baseOpacity,
      opacity: prefersReducedMotion ? baseOpacity : 0,
      delay: Math.random(),
      seed: Math.random() * 1000,
    };
  });

  startTime = performance.now();
  phase = prefersReducedMotion ? "idle" : "assembling";

  // Start animation loop
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(animate);
}

// --- Animation loop ---
function animate() {
  ctx = canvas.getContext("2d");
  if (particles.length === 0) {
    rafId = requestAnimationFrame(animate);
    return;
  }

  const now = performance.now();
  const assemblyElapsed = now - startTime;
  const assemblyDuration = CONFIG.assemblyDuration;
  const repelRadius = CONFIG.repelRadius * dpr;
  const repelStrength = CONFIG.repelStrength;
  const t = now * 0.001;

  // Clear
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];

    // --- Phase logic ---
    let arrived = 1;
    if (phase === "assembling") {
      const particleStart = p.delay * assemblyDuration * 0.6;
      const particleDur = assemblyDuration * 0.55;
      const localT = (assemblyElapsed - particleStart) / particleDur;
      arrived = Math.max(0, Math.min(1, localT));
      const eased = 1 - Math.pow(1 - arrived, 3);
      p.opacity = p.baseOpacity * eased;
    }

    if (arrived > 0) {
      // Spring toward target
      const ax = (p.tx - p.x) * 0.08;
      const ay = (p.ty - p.y) * 0.08;
      p.vx += ax;
      p.vy += ay;

      // Idle noise - subtle floating
      if (phase === "idle" || arrived > 0.8) {
        const noiseAmp = 1.2 * dpr;
        const nx = Math.sin(t * 0.8 + p.seed) * Math.cos(t * 0.5 + p.seed * 0.7) * noiseAmp;
        const ny = Math.cos(t * 0.7 + p.seed * 1.3) * Math.sin(t * 0.6 + p.seed * 0.5) * noiseAmp;
        p.vx += nx * 0.04;
        p.vy += ny * 0.04;

        // Opacity flicker
        p.opacity = p.baseOpacity * (0.82 + Math.sin(t * 1.5 + p.seed) * 0.18);
      }

      // Mouse SHATTER
      if (CONFIG.interactive && mouse.active) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < repelRadius * repelRadius && dist2 > 0.01) {
          const dist = Math.sqrt(dist2);
          const normalizedDist = dist / repelRadius;
          const shatterForce =
            normalizedDist < 0.4
              ? (1 - normalizedDist / 0.4) * 18
              : (1 - normalizedDist) * repelStrength * 4;
          p.vx += (dx / dist) * shatterForce;
          p.vy += (dy / dist) * shatterForce;

          if (normalizedDist < 0.5) {
            p.opacity = Math.min(1, p.opacity * 1.5);
          }
        }
        // Hover brightness
        if (dist2 < (repelRadius * 1.8) * (repelRadius * 1.8)) {
          p.opacity = Math.min(1, p.opacity * 1.25);
        }
      }

      // Damping
      p.vx *= 0.84;
      p.vy *= 0.84;
    }

    p.x += p.vx;
    p.y += p.vy;

    // Draw square
    const op = Math.max(0, Math.min(1, p.opacity));
    if (op < 0.02) continue;

    ctx.globalAlpha = op;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }

  // Reset alpha
  ctx.globalAlpha = 1;

  // Transition to idle phase
  if (phase === "assembling" && assemblyElapsed > assemblyDuration + 300) {
    phase = "idle";
  }

  rafId = requestAnimationFrame(animate);
}

// --- Mouse tracking ---
function onMouseMove(e) {
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const pad = 60;
  if (
    e.clientX < rect.left - pad ||
    e.clientX > rect.right + pad ||
    e.clientY < rect.top - pad ||
    e.clientY > rect.bottom + pad
  ) {
    mouse.active = false;
    return;
  }
  mouse.x = (e.clientX - rect.left) * dpr;
  mouse.y = (e.clientY - rect.top) * dpr;
  mouse.active = true;
}

// --- Visibility change ---
function onVisibilityChange() {
  if (document.hidden) {
    cancelAnimationFrame(rafId);
  } else {
    rafId = requestAnimationFrame(animate);
  }
}

// --- Start ---
window.addEventListener("load", init);
</script>
</body>
</html>
